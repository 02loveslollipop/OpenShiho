name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release archive
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/openshiho"
          cp -r container/. "$STAGE/openshiho/"
          cp README.md "$STAGE/openshiho/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/openshiho-${VERSION}.zip" openshiho)
          # Stable-named copy so releases/latest/download/openshiho-latest.zip always works.
          cp "openshiho-${VERSION}.zip" openshiho-latest.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: openshiho-*.zip
          generate_release_notes: true
