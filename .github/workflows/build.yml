name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build image (${{ matrix.runtime }})
        working-directory: container
        run: |
          RUNTIME=${{ matrix.runtime }} TAG=shiho-runtime:ci ./build.sh

      - name: Verify image exists
        working-directory: container
        run: |
          if [ "${{ matrix.runtime }}" = "podman" ]; then
            podman image inspect shiho-runtime:ci >/dev/null
          else
            docker image inspect shiho-runtime:ci >/dev/null
          fi
